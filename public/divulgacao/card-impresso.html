<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1080px;overflow:hidden}
  body{
    background:
      radial-gradient(ellipse at 50% 35%, #3a1d7a 0%, #1a0a47 45%, #0d0221 100%);
    position:relative;color:#fff;
    font-family:'Share Tech Mono', monospace;
  }

  .grid{
    position:absolute;left:0;right:0;bottom:0;height:280px;
    background-image:
      linear-gradient(rgba(1,205,254,.25) 1px,transparent 1px),
      linear-gradient(90deg,rgba(1,205,254,.25) 1px,transparent 1px);
    background-size:80px 80px;
    transform-origin:bottom;
    transform:perspective(700px) rotateX(62deg);
    mask-image:linear-gradient(to top,#000 30%,transparent);
    opacity:.7;
  }

  .sun{
    position:absolute;right:-90px;top:60px;
    width:280px;height:280px;border-radius:50%;
    background:linear-gradient(180deg,#fff700 0%,#ff71ce 60%,#ff2e93 100%);
    opacity:.22;filter:blur(2px);
  }

  .hud{position:absolute;inset:36px;border:2px solid rgba(1,205,254,.5)}
  .hud::before{content:"";position:absolute;inset:14px;border:1px solid rgba(5,255,161,.22)}
  .corner{position:absolute;width:54px;height:54px;border:3px solid #05ffa1;box-shadow:0 0 12px #05ffa1}
  .corner.tl{top:-2px;left:-2px;border-right:none;border-bottom:none}
  .corner.tr{top:-2px;right:-2px;border-left:none;border-bottom:none}
  .corner.bl{bottom:-2px;left:-2px;border-right:none;border-top:none}
  .corner.br{bottom:-2px;right:-2px;border-left:none;border-top:none}

  .tx{
    position:absolute;top:90px;left:90px;right:90px;
    display:flex;align-items:center;gap:18px;
    font-family:'Share Tech Mono', monospace;
    font-size:22px;letter-spacing:6px;text-transform:uppercase;
  }
  .tx .tag{color:#01cdfe}
  .tx .arr{color:#05ffa1}
  .tx .msg{color:#05ffa1}
  .tx .cursor{margin-left:auto;width:14px;height:22px;background:#05ffa1}

  /* HERO compacto (sprite menor, título menor) pra abrir espaço pro QR grande */
  .hero{
    position:absolute;top:160px;left:0;right:0;
    display:flex;align-items:center;justify-content:center;gap:36px;
    padding:0 90px;
  }
  .sprite{
    width:170px;height:170px;
    image-rendering:pixelated;
    filter:drop-shadow(0 0 22px rgba(255,46,147,.55));
    flex-shrink:0;
  }
  .titles{display:flex;flex-direction:column;align-items:flex-start;gap:18px}
  .t1{
    font-family:'Press Start 2P', monospace;color:#05ffa1;
    font-size:42px;letter-spacing:5px;line-height:1;
    text-shadow:0 0 16px #05ffa1, 0 0 32px rgba(5,255,161,.4);
  }
  .t2{
    font-family:'Press Start 2P', monospace;color:#fff700;
    font-size:54px;letter-spacing:6px;line-height:1;
    text-shadow:0 0 18px #fff700, 0 0 36px rgba(255,247,0,.4);
  }

  .sub{
    position:absolute;top:380px;left:0;right:0;text-align:center;
    font-family:'Share Tech Mono', monospace;
    font-size:22px;letter-spacing:8px;text-transform:uppercase;
    color:#ff71ce;
  }

  .sep{
    position:absolute;top:430px;left:240px;right:240px;
    border-top:1px dashed rgba(1,205,254,.5);
  }

  .qa{
    position:absolute;top:470px;left:140px;right:140px;
    padding:24px 30px;
    background:rgba(13,2,33,.78);
    border:1px solid rgba(1,205,254,.35);
    box-shadow:inset 0 0 30px rgba(1,205,254,.08);
    text-align:center;
  }
  .qa .q{
    font-family:'VT323', monospace;
    font-size:44px;line-height:1.05;color:#fff;
    text-shadow:0 0 12px rgba(255,255,255,.35);
  }
  .qa .q strong{color:#fff700}

  /* CHAMADA pro QR */
  .scan-call{
    position:absolute;top:620px;left:0;right:0;text-align:center;
    font-family:'Share Tech Mono', monospace;
    font-size:22px;letter-spacing:6px;text-transform:uppercase;
    color:#05ffa1;
  }
  .scan-call .arr{color:#ff71ce;margin:0 12px}

  /* QR GRANDE central */
  .qr-big{
    position:absolute;bottom:90px;left:50%;transform:translateX(-50%);
    width:280px;height:280px;padding:16px;background:#fff;
    border:4px solid #ff2e93;
    box-shadow:0 0 30px rgba(255,46,147,.7), 0 0 60px rgba(5,255,161,.3);
  }
  .qr-big img{width:100%;height:100%;display:block}

  .scan{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,.16) 0,
      rgba(0,0,0,.16) 2px,
      transparent 2px,
      transparent 4px
    );
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="sun"></div>

  <div class="hud">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>

  <div class="tx">
    <span class="tag">[TX-01]</span>
    <span class="arr">▸</span>
    <span class="msg">UFTM-KEPLER · 2087</span>
    <span class="cursor"></span>
  </div>

  <div class="hero">
    <img class="sprite" src="../sprites/cuidador.svg" alt=""/>
    <div class="titles">
      <div class="t1">PROTOCOLO</div>
      <div class="t2">VOCAÇÃO</div>
    </div>
  </div>

  <div class="sub">// FEIRA DE PROFISSÕES · UFTM 2026</div>
  <div class="sep"></div>

  <div class="qa">
    <div class="q">qual curso da <strong>UFTM</strong><br/>combina com você?</div>
  </div>

  <div class="scan-call">
    <span class="arr">▸</span>aponte a câmera<span class="arr">◂</span>
  </div>

  <div class="qr-big"><img src="qr.svg" alt="QR Code para o quiz"/></div>

  <div class="scan"></div>
</body>
</html>
