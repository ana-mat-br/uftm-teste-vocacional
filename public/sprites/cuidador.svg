<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Cuidador 16x16 v2: sombreamento + boca + mãozinhas -->
  <!-- Coração no topo (com brilho) -->
  <rect x="6" y="0" width="1" height="1" fill="#ffe680"/>
  <rect x="9" y="0" width="1" height="1" fill="#ffcc00"/>
  <rect x="5" y="1" width="1" height="1" fill="#ffe680"/>
  <rect x="6" y="1" width="3" height="1" fill="#ffcc00"/>
  <rect x="9" y="1" width="2" height="1" fill="#e6a800"/>
  <rect x="5" y="2" width="6" height="1" fill="#ffcc00"/>
  <rect x="6" y="2" width="1" height="1" fill="#ffe680"/>
  <rect x="6" y="3" width="4" height="1" fill="#ffcc00"/>
  <rect x="7" y="4" width="2" height="1" fill="#e6a800"/>
  <!-- Cabeça (3 tons de rosa) -->
  <rect x="4" y="5" width="8" height="1" fill="#ff8fc8"/>
  <rect x="3" y="6" width="10" height="1" fill="#ffb3d9"/>
  <rect x="4" y="6" width="1" height="1" fill="#ffd3e8"/>
  <rect x="3" y="7" width="10" height="1" fill="#ffb3d9"/>
  <rect x="3" y="8" width="10" height="1" fill="#ff8fc8"/>
  <!-- Olhos (brilho posicionado pra dar direção) -->
  <rect x="5" y="7" width="2" height="2" fill="#4a1078"/>
  <rect x="9" y="7" width="2" height="2" fill="#4a1078"/>
  <rect x="5" y="7" width="1" height="1" fill="#fff"/>
  <rect x="9" y="7" width="1" height="1" fill="#fff"/>
  <!-- Bochechas (acento variável por codinome) -->
  <rect x="3" y="9" width="1" height="1" fill="#ff00fe"/>
  <rect x="12" y="9" width="1" height="1" fill="#ff00fe"/>
  <!-- Bocha (sorrindo) -->
  <rect x="7" y="9" width="2" height="1" fill="#cc1a6e"/>
  <rect x="6" y="9" width="1" height="1" fill="#cc1a6e"/>
  <rect x="9" y="9" width="1" height="1" fill="#cc1a6e"/>
  <!-- Corpo -->
  <rect x="4" y="9" width="2" height="1" fill="#ffb3d9"/>
  <rect x="10" y="9" width="2" height="1" fill="#ffb3d9"/>
  <rect x="4" y="10" width="8" height="1" fill="#ff8fc8"/>
  <rect x="5" y="10" width="6" height="1" fill="#ffb3d9"/>
  <rect x="5" y="11" width="6" height="1" fill="#ff5fa8"/>
  <!-- Mãozinhas (estendidas pros lados, gesto de cuidar) -->
  <rect x="2" y="10" width="1" height="1" fill="#ff8fc8"/>
  <rect x="13" y="10" width="1" height="1" fill="#ff8fc8"/>
  <!-- Pernas -->
  <rect x="4" y="12" width="2" height="1" fill="#ff5fa8"/>
  <rect x="10" y="12" width="2" height="1" fill="#ff5fa8"/>
  <rect x="4" y="13" width="2" height="1" fill="#cc1a6e"/>
  <rect x="10" y="13" width="2" height="1" fill="#cc1a6e"/>
</svg>
