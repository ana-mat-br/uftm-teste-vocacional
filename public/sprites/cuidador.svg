<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Cuidador: rosa pastel + coraçãozinho amarelo no topo -->
  <!-- Coração no topo -->
  <rect x="6" y="0" width="1" height="1" fill="#ffcc00"/>
  <rect x="9" y="0" width="1" height="1" fill="#ffcc00"/>
  <rect x="5" y="1" width="6" height="1" fill="#ffcc00"/>
  <rect x="6" y="2" width="4" height="1" fill="#ffcc00"/>
  <rect x="7" y="3" width="2" height="1" fill="#ffcc00"/>
  <!-- Cabeça -->
  <rect x="4" y="4" width="8" height="1" fill="#ff8fc8"/>
  <rect x="3" y="5" width="10" height="1" fill="#ffb3d9"/>
  <rect x="3" y="6" width="10" height="1" fill="#ffb3d9"/>
  <rect x="3" y="7" width="10" height="1" fill="#ffb3d9"/>
  <!-- Olhos -->
  <rect x="5" y="6" width="2" height="2" fill="#4a1078"/>
  <rect x="9" y="6" width="2" height="2" fill="#4a1078"/>
  <rect x="6" y="6" width="1" height="1" fill="#fff"/>
  <rect x="10" y="6" width="1" height="1" fill="#fff"/>
  <!-- Bochechas -->
  <rect x="3" y="8" width="1" height="1" fill="#ff5fa8"/>
  <rect x="12" y="8" width="1" height="1" fill="#ff5fa8"/>
  <!-- Corpo -->
  <rect x="4" y="8" width="8" height="1" fill="#ff8fc8"/>
  <rect x="4" y="9" width="8" height="1" fill="#ff8fc8"/>
  <rect x="5" y="10" width="6" height="1" fill="#ff5fa8"/>
  <!-- Pernas -->
  <rect x="4" y="11" width="2" height="1" fill="#ff5fa8"/>
  <rect x="10" y="11" width="2" height="1" fill="#ff5fa8"/>
</svg>
