<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Comunicador: rosa+amarelo + balão de fala no topo -->
  <!-- Balão de fala -->
  <rect x="9" y="0" width="6" height="1" fill="#fff8e7"/>
  <rect x="9" y="1" width="6" height="2" fill="#fff8e7"/>
  <rect x="10" y="1" width="1" height="1" fill="#ff2e93"/>
  <rect x="12" y="1" width="1" height="1" fill="#ff2e93"/>
  <rect x="14" y="1" width="1" height="1" fill="#ff2e93"/>
  <rect x="9" y="3" width="1" height="1" fill="#fff8e7"/>
  <rect x="8" y="3" width="1" height="1" fill="#fff8e7"/>
  <!-- Cabeça -->
  <rect x="4" y="4" width="8" height="1" fill="#ffcc00"/>
  <rect x="3" y="5" width="10" height="1" fill="#fff95e"/>
  <rect x="3" y="6" width="10" height="1" fill="#fff95e"/>
  <rect x="3" y="7" width="10" height="1" fill="#fff95e"/>
  <!-- Olhos -->
  <rect x="5" y="6" width="2" height="2" fill="#4a1078"/>
  <rect x="9" y="6" width="2" height="2" fill="#4a1078"/>
  <rect x="6" y="6" width="1" height="1" fill="#fff"/>
  <rect x="10" y="6" width="1" height="1" fill="#fff"/>
  <!-- Bochechas (rosa quente, marcadas) -->
  <rect x="3" y="8" width="2" height="1" fill="#ff5fa8"/>
  <rect x="11" y="8" width="2" height="1" fill="#ff5fa8"/>
  <!-- Bocha aberta (sorrindo) -->
  <rect x="6" y="8" width="4" height="1" fill="#ff2e93"/>
  <rect x="7" y="9" width="2" height="1" fill="#ff2e93"/>
  <!-- Corpo -->
  <rect x="4" y="8" width="2" height="1" fill="#fff95e"/>
  <rect x="10" y="8" width="2" height="1" fill="#fff95e"/>
  <rect x="4" y="9" width="3" height="1" fill="#fff95e"/>
  <rect x="9" y="9" width="3" height="1" fill="#fff95e"/>
  <rect x="5" y="10" width="6" height="1" fill="#ffcc00"/>
  <!-- Pernas -->
  <rect x="4" y="11" width="2" height="1" fill="#ff5fa8"/>
  <rect x="10" y="11" width="2" height="1" fill="#ff5fa8"/>
</svg>
