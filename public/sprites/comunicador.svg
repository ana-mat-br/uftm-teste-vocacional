<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Comunicador 16x16 v2: balão + cabeça em 3 tons + boca aberta + mãozinhas (uma com microfone) -->
  <!-- Balão de fala -->
  <rect x="9" y="0" width="6" height="1" fill="#fff8e7"/>
  <rect x="8" y="1" width="7" height="2" fill="#fff8e7"/>
  <rect x="9" y="3" width="5" height="1" fill="#fff8e7"/>
  <rect x="10" y="1" width="1" height="1" fill="#ff2e93"/>
  <rect x="12" y="1" width="1" height="1" fill="#ff2e93"/>
  <rect x="14" y="1" width="1" height="1" fill="#ff2e93"/>
  <rect x="8" y="3" width="1" height="1" fill="#fff8e7"/>
  <rect x="7" y="4" width="1" height="1" fill="#fff8e7"/>
  <!-- Cabeça (3 tons de amarelo) -->
  <rect x="4" y="5" width="8" height="1" fill="#e6a800"/>
  <rect x="3" y="6" width="10" height="1" fill="#ffcc00"/>
  <rect x="4" y="6" width="1" height="1" fill="#fff95e"/>
  <rect x="3" y="7" width="10" height="1" fill="#fff95e"/>
  <rect x="3" y="8" width="10" height="1" fill="#ffcc00"/>
  <!-- Olhos sorrindo -->
  <rect x="5" y="7" width="2" height="2" fill="#4a1078"/>
  <rect x="9" y="7" width="2" height="2" fill="#4a1078"/>
  <rect x="5" y="7" width="1" height="1" fill="#fff"/>
  <rect x="9" y="7" width="1" height="1" fill="#fff"/>
  <!-- Bochechas marcadas (acento variável por codinome) -->
  <rect x="3" y="9" width="1" height="1" fill="#ff00fe"/>
  <rect x="12" y="9" width="1" height="1" fill="#ff00fe"/>
  <!-- Boca aberta (falando) -->
  <rect x="6" y="9" width="4" height="1" fill="#ff2e93"/>
  <rect x="7" y="9" width="2" height="1" fill="#ff8fc8"/>
  <!-- Corpo -->
  <rect x="4" y="9" width="2" height="1" fill="#ffcc00"/>
  <rect x="10" y="9" width="2" height="1" fill="#ffcc00"/>
  <rect x="4" y="10" width="8" height="1" fill="#e6a800"/>
  <rect x="5" y="10" width="6" height="1" fill="#ffcc00"/>
  <rect x="5" y="11" width="6" height="1" fill="#e6a800"/>
  <!-- Mãozinha esquerda com microfone -->
  <rect x="2" y="10" width="1" height="1" fill="#ffcc00"/>
  <rect x="0" y="9" width="2" height="2" fill="#cc1a6e"/>
  <rect x="0" y="9" width="1" height="1" fill="#ff2e93"/>
  <!-- Mãozinha direita -->
  <rect x="13" y="10" width="1" height="1" fill="#ffcc00"/>
  <!-- Pernas -->
  <rect x="4" y="12" width="2" height="1" fill="#ff5fa8"/>
  <rect x="10" y="12" width="2" height="1" fill="#ff5fa8"/>
  <rect x="4" y="13" width="2" height="1" fill="#cc1a6e"/>
  <rect x="10" y="13" width="2" height="1" fill="#cc1a6e"/>
</svg>
