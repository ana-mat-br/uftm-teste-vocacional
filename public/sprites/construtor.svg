<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Construtor: laranja + capacete/engrenagem amarela, expressão focada -->
  <!-- Engrenagem (mais detalhada, com furo no centro) -->
  <rect x="7" y="0" width="2" height="1" fill="#ffcc00"/>
  <rect x="5" y="1" width="1" height="1" fill="#ffcc00"/>
  <rect x="6" y="1" width="4" height="1" fill="#ffcc00"/>
  <rect x="10" y="1" width="1" height="1" fill="#ffcc00"/>
  <rect x="5" y="2" width="6" height="1" fill="#ffcc00"/>
  <rect x="6" y="3" width="4" height="1" fill="#ffcc00"/>
  <!-- Furo da engrenagem (mostra o "mecanismo") -->
  <rect x="7" y="2" width="2" height="1" fill="#ff6b35"/>
  <!-- Brilho metálico -->
  <rect x="6" y="1" width="1" height="1" fill="#fff95e"/>
  <!-- Cabeça -->
  <rect x="4" y="4" width="3" height="1" fill="#ff8c5a"/>
  <rect x="9" y="4" width="3" height="1" fill="#ff8c5a"/>
  <rect x="3" y="5" width="10" height="1" fill="#ff6b35"/>
  <rect x="3" y="6" width="10" height="1" fill="#ff6b35"/>
  <rect x="3" y="7" width="10" height="1" fill="#ff6b35"/>
  <!-- Highlight no rosto -->
  <rect x="3" y="5" width="1" height="1" fill="#ff9966"/>
  <rect x="4" y="5" width="1" height="1" fill="#ff9966"/>
  <!-- Olhos cyan determinados -->
  <rect x="5" y="6" width="2" height="2" fill="#00f0ff"/>
  <rect x="9" y="6" width="2" height="2" fill="#00f0ff"/>
  <rect x="6" y="6" width="1" height="1" fill="#fff"/>
  <rect x="10" y="6" width="1" height="1" fill="#fff"/>
  <!-- Bochechas amarelas -->
  <rect x="3" y="8" width="1" height="1" fill="#ffcc00"/>
  <rect x="12" y="8" width="1" height="1" fill="#ffcc00"/>
  <!-- Boca firme (focado) -->
  <rect x="7" y="8" width="2" height="1" fill="#cc4515"/>
  <!-- Corpo -->
  <rect x="4" y="8" width="3" height="1" fill="#ff8c5a"/>
  <rect x="9" y="8" width="3" height="1" fill="#ff8c5a"/>
  <rect x="4" y="9" width="8" height="1" fill="#ff6b35"/>
  <!-- Cinto com fivela -->
  <rect x="5" y="10" width="6" height="1" fill="#ffcc00"/>
  <rect x="7" y="10" width="2" height="1" fill="#cc9900"/>
  <!-- Pernas -->
  <rect x="4" y="11" width="2" height="1" fill="#ff2e93"/>
  <rect x="10" y="11" width="2" height="1" fill="#ff2e93"/>
</svg>
