<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Co-piloto-mistério A: luzinha rosa flutuante (alinhada com lore "luzinha rosa flutua até você") -->
  <!-- Halo externo (transparência via opacity) -->
  <rect x="3" y="5" width="10" height="6" fill="#ff2e93" opacity="0.15"/>
  <rect x="4" y="4" width="8" height="8" fill="#ff2e93" opacity="0.2"/>
  <!-- Núcleo médio -->
  <rect x="5" y="5" width="6" height="6" fill="#ff5fa8"/>
  <!-- Núcleo brilhante (rosa mais claro) -->
  <rect x="6" y="6" width="4" height="4" fill="#ffb3d9"/>
  <!-- Centro super-brilhante (quase branco) -->
  <rect x="7" y="7" width="2" height="2" fill="#fff8e7"/>
  <!-- Highlights piscando -->
  <rect x="7" y="6" width="1" height="1" fill="#fff">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="9" y="9" width="1" height="1" fill="#fff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
