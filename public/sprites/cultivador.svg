<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Cultivador 16x16 v2: folha + florzinha + cabeça 3 tons rosa + mãozinha com brotinho -->
  <!-- Folha principal -->
  <rect x="7" y="0" width="2" height="1" fill="#7ee787"/>
  <rect x="6" y="1" width="4" height="1" fill="#7ee787"/>
  <rect x="5" y="2" width="4" height="1" fill="#7ee787"/>
  <rect x="9" y="2" width="1" height="1" fill="#5cb868"/>
  <rect x="6" y="3" width="2" height="1" fill="#5cb868"/>
  <rect x="6" y="1" width="1" height="1" fill="#a8f0ad"/>
  <!-- Florzinha -->
  <rect x="10" y="1" width="1" height="1" fill="#ffcc00"/>
  <rect x="11" y="1" width="1" height="1" fill="#fff95e"/>
  <rect x="10" y="2" width="2" height="1" fill="#ffcc00"/>
  <!-- Talo -->
  <rect x="7" y="4" width="1" height="1" fill="#5cb868"/>
  <rect x="8" y="4" width="1" height="1" fill="#3d8848"/>
  <!-- Cabeça (3 tons de rosa) -->
  <rect x="4" y="5" width="8" height="1" fill="#ff5fa8"/>
  <rect x="3" y="6" width="10" height="1" fill="#ff8fc8"/>
  <rect x="4" y="6" width="1" height="1" fill="#ffb3d9"/>
  <rect x="3" y="7" width="10" height="1" fill="#ffb3d9"/>
  <rect x="3" y="8" width="10" height="1" fill="#ff8fc8"/>
  <!-- Olhos cyan -->
  <rect x="5" y="7" width="2" height="2" fill="#00f0ff"/>
  <rect x="9" y="7" width="2" height="2" fill="#00f0ff"/>
  <rect x="5" y="7" width="1" height="1" fill="#fff"/>
  <rect x="9" y="7" width="1" height="1" fill="#fff"/>
  <!-- Bochechas (acento variável por codinome) -->
  <rect x="3" y="9" width="1" height="1" fill="#ff00fe"/>
  <rect x="12" y="9" width="1" height="1" fill="#ff00fe"/>
  <!-- Sorriso terreno -->
  <rect x="7" y="9" width="2" height="1" fill="#ff2e93"/>
  <rect x="6" y="9" width="1" height="1" fill="#ff5fa8"/>
  <rect x="9" y="9" width="1" height="1" fill="#ff5fa8"/>
  <!-- Corpo -->
  <rect x="4" y="9" width="2" height="1" fill="#ff8fc8"/>
  <rect x="10" y="9" width="2" height="1" fill="#ff8fc8"/>
  <rect x="4" y="10" width="8" height="1" fill="#ff8fc8"/>
  <!-- Vinha no peito -->
  <rect x="6" y="10" width="1" height="1" fill="#7ee787"/>
  <rect x="9" y="10" width="1" height="1" fill="#7ee787"/>
  <rect x="7" y="11" width="2" height="1" fill="#7ee787"/>
  <rect x="5" y="11" width="2" height="1" fill="#ff5fa8"/>
  <rect x="9" y="11" width="2" height="1" fill="#ff5fa8"/>
  <!-- Mãozinha esquerda com broto -->
  <rect x="2" y="10" width="1" height="1" fill="#ff8fc8"/>
  <rect x="0" y="9" width="2" height="1" fill="#7ee787"/>
  <rect x="1" y="10" width="1" height="1" fill="#5cb868"/>
  <!-- Mãozinha direita -->
  <rect x="13" y="10" width="1" height="1" fill="#ff8fc8"/>
  <!-- Pernas verdes (raízes) -->
  <rect x="4" y="12" width="2" height="1" fill="#5cb868"/>
  <rect x="10" y="12" width="2" height="1" fill="#5cb868"/>
  <rect x="4" y="13" width="2" height="1" fill="#3d8848"/>
  <rect x="10" y="13" width="2" height="1" fill="#3d8848"/>
</svg>
