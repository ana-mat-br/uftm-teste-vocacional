<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Co-piloto-mistério C: silhueta neutra com "?" no rosto -->
  <!-- Antena pequena (sem acessório específico, neutra) -->
  <rect x="7" y="2" width="2" height="2" fill="#7a1eab"/>
  <rect x="7" y="1" width="2" height="1" fill="#d4a8ff">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Cabeça -->
  <rect x="4" y="4" width="3" height="1" fill="#5d2880"/>
  <rect x="9" y="4" width="3" height="1" fill="#5d2880"/>
  <rect x="3" y="5" width="10" height="3" fill="#7a1eab"/>
  <!-- "?" no rosto -->
  <rect x="6" y="5" width="3" height="1" fill="#fff8e7"/>
  <rect x="9" y="6" width="1" height="1" fill="#fff8e7"/>
  <rect x="8" y="7" width="1" height="1" fill="#fff8e7"/>
  <rect x="8" y="9" width="1" height="1" fill="#fff8e7"/>
  <!-- Bochechas (apenas indicação) -->
  <rect x="3" y="8" width="1" height="1" fill="#ff2e93" opacity="0.5"/>
  <rect x="12" y="8" width="1" height="1" fill="#ff2e93" opacity="0.5"/>
  <!-- Corpo -->
  <rect x="4" y="8" width="8" height="1" fill="#5d2880"/>
  <rect x="4" y="9" width="8" height="1" fill="#7a1eab"/>
  <rect x="5" y="10" width="6" height="1" fill="#5d2880"/>
  <!-- Pernas -->
  <rect x="4" y="11" width="2" height="1" fill="#5d2880"/>
  <rect x="10" y="11" width="2" height="1" fill="#5d2880"/>
</svg>
