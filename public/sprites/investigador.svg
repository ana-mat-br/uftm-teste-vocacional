<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Investigador: roxo + antena com sensor cyan brilhando, expressão curiosa -->
  <!-- Sparkle no topo (brilho da antena) -->
  <rect x="7" y="0" width="2" height="1" fill="#fff"/>
  <!-- Sensor da antena (esfera maior) -->
  <rect x="6" y="1" width="4" height="1" fill="#00f0ff"/>
  <rect x="5" y="2" width="6" height="1" fill="#00f0ff"/>
  <rect x="6" y="3" width="4" height="1" fill="#00f0ff"/>
  <!-- Brilho na esfera -->
  <rect x="6" y="1" width="1" height="1" fill="#fff"/>
  <rect x="7" y="2" width="1" height="1" fill="#fff"/>
  <!-- Mastrinho da antena -->
  <rect x="7" y="4" width="2" height="1" fill="#4a1078"/>
  <!-- Cabeça -->
  <rect x="4" y="4" width="3" height="1" fill="#7a1eab"/>
  <rect x="9" y="4" width="3" height="1" fill="#7a1eab"/>
  <rect x="3" y="5" width="10" height="1" fill="#b026ff"/>
  <rect x="3" y="6" width="10" height="1" fill="#b026ff"/>
  <rect x="3" y="7" width="10" height="1" fill="#b026ff"/>
  <!-- Highlight no rosto -->
  <rect x="3" y="5" width="1" height="1" fill="#c950ff"/>
  <rect x="4" y="5" width="1" height="1" fill="#c950ff"/>
  <!-- Óculos (linha que conecta) -->
  <rect x="4" y="6" width="1" height="1" fill="#00f0ff"/>
  <rect x="7" y="6" width="2" height="1" fill="#00f0ff"/>
  <rect x="11" y="6" width="1" height="1" fill="#00f0ff"/>
  <!-- Olhos cyan (olhar pra cima, curioso) -->
  <rect x="5" y="6" width="2" height="2" fill="#00f0ff"/>
  <rect x="9" y="6" width="2" height="2" fill="#00f0ff"/>
  <rect x="5" y="6" width="1" height="1" fill="#fff"/>
  <rect x="9" y="6" width="1" height="1" fill="#fff"/>
  <!-- Bochechas -->
  <rect x="3" y="8" width="1" height="1" fill="#ff2e93"/>
  <rect x="12" y="8" width="1" height="1" fill="#ff2e93"/>
  <!-- Boca pequena (concentrado, "hmm") -->
  <rect x="7" y="8" width="2" height="1" fill="#4a1078"/>
  <!-- Corpo -->
  <rect x="4" y="8" width="3" height="1" fill="#7a1eab"/>
  <rect x="9" y="8" width="3" height="1" fill="#7a1eab"/>
  <rect x="4" y="9" width="8" height="1" fill="#7a1eab"/>
  <rect x="5" y="10" width="6" height="1" fill="#ff2e93"/>
  <!-- Detalhe: bolso com "?" (curiosidade) -->
  <rect x="7" y="9" width="2" height="1" fill="#fff95e"/>
  <!-- Pernas -->
  <rect x="4" y="11" width="2" height="1" fill="#ff2e93"/>
  <rect x="10" y="11" width="2" height="1" fill="#ff2e93"/>
</svg>
