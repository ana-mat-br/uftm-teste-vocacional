<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Investigador: roxo + antena com sensor cyan grande -->
  <!-- Sensor antena -->
  <rect x="7" y="0" width="2" height="1" fill="#00f0ff"/>
  <rect x="6" y="1" width="4" height="2" fill="#00f0ff"/>
  <rect x="7" y="1" width="2" height="1" fill="#fff"/>
  <rect x="7" y="3" width="2" height="1" fill="#4a1078"/>
  <!-- Cabeça -->
  <rect x="4" y="4" width="8" height="1" fill="#7a1eab"/>
  <rect x="3" y="5" width="10" height="1" fill="#b026ff"/>
  <rect x="3" y="6" width="10" height="1" fill="#b026ff"/>
  <rect x="3" y="7" width="10" height="1" fill="#b026ff"/>
  <!-- Óculos (linha que conecta os olhos) -->
  <rect x="4" y="6" width="1" height="1" fill="#00f0ff"/>
  <rect x="7" y="6" width="2" height="1" fill="#00f0ff"/>
  <rect x="11" y="6" width="1" height="1" fill="#00f0ff"/>
  <!-- Olhos -->
  <rect x="5" y="6" width="2" height="2" fill="#00f0ff"/>
  <rect x="9" y="6" width="2" height="2" fill="#00f0ff"/>
  <rect x="6" y="7" width="1" height="1" fill="#fff"/>
  <rect x="10" y="7" width="1" height="1" fill="#fff"/>
  <!-- Bochechas -->
  <rect x="3" y="8" width="1" height="1" fill="#ff2e93"/>
  <rect x="12" y="8" width="1" height="1" fill="#ff2e93"/>
  <!-- Corpo -->
  <rect x="4" y="8" width="8" height="1" fill="#7a1eab"/>
  <rect x="4" y="9" width="8" height="1" fill="#7a1eab"/>
  <rect x="5" y="10" width="6" height="1" fill="#ff2e93"/>
  <!-- Pernas -->
  <rect x="4" y="11" width="2" height="1" fill="#ff2e93"/>
  <rect x="10" y="11" width="2" height="1" fill="#ff2e93"/>
</svg>
