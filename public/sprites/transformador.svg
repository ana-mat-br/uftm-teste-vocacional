<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Transformador 16x16 v2: bandeira tricolor + cabeça magenta 3 tons + mãozinha erguida -->
  <!-- Mastro -->
  <rect x="7" y="0" width="1" height="6" fill="#fff8e7"/>
  <rect x="7" y="0" width="1" height="1" fill="#ffcc00"/>
  <!-- Bandeira tricolor -->
  <rect x="8" y="0" width="5" height="1" fill="#ffcc00"/>
  <rect x="8" y="1" width="6" height="1" fill="#ff2e93"/>
  <rect x="8" y="2" width="5" height="1" fill="#00f0ff"/>
  <rect x="13" y="0" width="1" height="1" fill="#cc9900"/>
  <rect x="12" y="2" width="1" height="1" fill="#0098b0"/>
  <!-- Cabeça (3 tons de magenta) -->
  <rect x="4" y="5" width="8" height="1" fill="#cc1a6e"/>
  <rect x="3" y="6" width="10" height="1" fill="#ff2e93"/>
  <rect x="4" y="6" width="1" height="1" fill="#ff5fa8"/>
  <rect x="3" y="7" width="10" height="1" fill="#ff5fa8"/>
  <rect x="3" y="8" width="10" height="1" fill="#ff2e93"/>
  <!-- Sobrancelhas determinadas -->
  <rect x="5" y="6" width="2" height="1" fill="#7a0e3a"/>
  <rect x="9" y="6" width="2" height="1" fill="#7a0e3a"/>
  <!-- Olhos amarelos -->
  <rect x="5" y="7" width="2" height="2" fill="#ffcc00"/>
  <rect x="9" y="7" width="2" height="2" fill="#ffcc00"/>
  <rect x="5" y="7" width="1" height="1" fill="#fff"/>
  <rect x="9" y="7" width="1" height="1" fill="#fff"/>
  <!-- Bochechas (acento variável por codinome) -->
  <rect x="3" y="9" width="1" height="1" fill="#ff00fe"/>
  <rect x="12" y="9" width="1" height="1" fill="#ff00fe"/>
  <!-- Boca firme/sorriso decidido -->
  <rect x="6" y="9" width="4" height="1" fill="#7a0e3a"/>
  <rect x="7" y="9" width="2" height="1" fill="#cc1a6e"/>
  <!-- Corpo -->
  <rect x="4" y="9" width="2" height="1" fill="#cc1a6e"/>
  <rect x="10" y="9" width="2" height="1" fill="#cc1a6e"/>
  <rect x="4" y="10" width="8" height="1" fill="#ff2e93"/>
  <rect x="5" y="10" width="6" height="1" fill="#ff5fa8"/>
  <!-- Faixa no peito -->
  <rect x="5" y="11" width="6" height="1" fill="#ff6b35"/>
  <rect x="7" y="11" width="2" height="1" fill="#ffcc00"/>
  <!-- Mãozinha esquerda erguida (gesto de mudança) -->
  <rect x="2" y="9" width="1" height="1" fill="#ff2e93"/>
  <rect x="1" y="8" width="1" height="1" fill="#ff2e93"/>
  <rect x="0" y="7" width="1" height="2" fill="#ffcc00"/>
  <!-- Mãozinha direita -->
  <rect x="13" y="10" width="1" height="1" fill="#ff2e93"/>
  <!-- Pernas cyan -->
  <rect x="4" y="12" width="2" height="1" fill="#00f0ff"/>
  <rect x="10" y="12" width="2" height="1" fill="#00f0ff"/>
  <rect x="4" y="13" width="2" height="1" fill="#0098b0"/>
  <rect x="10" y="13" width="2" height="1" fill="#0098b0"/>
</svg>
