<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Transformador: rosa-vermelho + bandeirinha no mastro -->
  <!-- Mastro da bandeira -->
  <rect x="7" y="0" width="1" height="6" fill="#fff8e7"/>
  <!-- Bandeira (tremulando à direita) -->
  <rect x="8" y="0" width="5" height="1" fill="#ffcc00"/>
  <rect x="8" y="1" width="6" height="1" fill="#ff2e93"/>
  <rect x="8" y="2" width="5" height="1" fill="#00f0ff"/>
  <!-- Cabeça -->
  <rect x="4" y="4" width="8" height="1" fill="#cc1a6e"/>
  <rect x="3" y="5" width="10" height="1" fill="#ff2e93"/>
  <rect x="3" y="6" width="10" height="1" fill="#ff2e93"/>
  <rect x="3" y="7" width="10" height="1" fill="#ff2e93"/>
  <!-- Olhos (amarelos, "olhar vivo") -->
  <rect x="5" y="6" width="2" height="2" fill="#ffcc00"/>
  <rect x="9" y="6" width="2" height="2" fill="#ffcc00"/>
  <rect x="6" y="6" width="1" height="1" fill="#fff"/>
  <rect x="10" y="6" width="1" height="1" fill="#fff"/>
  <!-- Bochechas (amarelo) -->
  <rect x="3" y="8" width="1" height="1" fill="#ffcc00"/>
  <rect x="12" y="8" width="1" height="1" fill="#ffcc00"/>
  <!-- Corpo -->
  <rect x="4" y="8" width="8" height="1" fill="#cc1a6e"/>
  <rect x="4" y="9" width="8" height="1" fill="#ff2e93"/>
  <rect x="5" y="10" width="6" height="1" fill="#ff6b35"/>
  <!-- Pernas -->
  <rect x="4" y="11" width="2" height="1" fill="#00f0ff"/>
  <rect x="10" y="11" width="2" height="1" fill="#00f0ff"/>
</svg>
