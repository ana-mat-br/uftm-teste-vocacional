<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Transformador: magenta + bandeirinha tricolor, expressão determinada -->
  <!-- Mastro da bandeira -->
  <rect x="7" y="0" width="1" height="6" fill="#fff8e7"/>
  <!-- Topo do mastro (ponta brilhante) -->
  <rect x="7" y="0" width="1" height="1" fill="#ffcc00"/>
  <!-- Bandeira tricolor (tremulando à direita) -->
  <rect x="8" y="0" width="5" height="1" fill="#ffcc00"/>
  <rect x="8" y="1" width="6" height="1" fill="#ff2e93"/>
  <rect x="8" y="2" width="5" height="1" fill="#00f0ff"/>
  <!-- Ondulação da bandeira -->
  <rect x="13" y="0" width="1" height="1" fill="#cc9900"/>
  <rect x="12" y="2" width="1" height="1" fill="#0098b0"/>
  <!-- Cabeça -->
  <rect x="4" y="4" width="3" height="1" fill="#cc1a6e"/>
  <rect x="9" y="4" width="3" height="1" fill="#cc1a6e"/>
  <rect x="3" y="5" width="10" height="1" fill="#ff2e93"/>
  <rect x="3" y="6" width="10" height="1" fill="#ff2e93"/>
  <rect x="3" y="7" width="10" height="1" fill="#ff2e93"/>
  <!-- Highlight no rosto -->
  <rect x="3" y="5" width="1" height="1" fill="#ff5fa8"/>
  <rect x="4" y="5" width="1" height="1" fill="#ff5fa8"/>
  <!-- Olhos amarelos (olhar vivo, determinado) -->
  <rect x="5" y="6" width="2" height="2" fill="#ffcc00"/>
  <rect x="9" y="6" width="2" height="2" fill="#ffcc00"/>
  <rect x="6" y="6" width="1" height="1" fill="#fff"/>
  <rect x="10" y="6" width="1" height="1" fill="#fff"/>
  <!-- Sobrancelha (determinação) -->
  <rect x="5" y="5" width="2" height="1" fill="#cc1a6e"/>
  <rect x="9" y="5" width="2" height="1" fill="#cc1a6e"/>
  <!-- Bochechas amarelas -->
  <rect x="3" y="8" width="1" height="1" fill="#ffcc00"/>
  <rect x="12" y="8" width="1" height="1" fill="#ffcc00"/>
  <!-- Boca firme (sorriso decidido) -->
  <rect x="6" y="8" width="4" height="1" fill="#cc1a6e"/>
  <!-- Corpo -->
  <rect x="4" y="8" width="2" height="1" fill="#cc1a6e"/>
  <rect x="10" y="8" width="2" height="1" fill="#cc1a6e"/>
  <rect x="4" y="9" width="8" height="1" fill="#ff2e93"/>
  <!-- Faixa no peito (símbolo de transformação) -->
  <rect x="5" y="10" width="6" height="1" fill="#ff6b35"/>
  <rect x="7" y="10" width="2" height="1" fill="#ffcc00"/>
  <!-- Pernas -->
  <rect x="4" y="11" width="2" height="1" fill="#00f0ff"/>
  <rect x="10" y="11" width="2" height="1" fill="#00f0ff"/>
</svg>
