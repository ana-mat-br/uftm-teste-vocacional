<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Transformador 32x32 Stardew-tier -->
  <!-- Mastro da bandeira -->
  <rect x="14" y="0" width="2" height="11" fill="#fff8e7"/>
  <rect x="14" y="0" width="2" height="1" fill="#ffcc00"/>
  <rect x="14" y="1" width="1" height="10" fill="#d4a8ff"/>
  <!-- Bandeira tricolor tremulando -->
  <rect x="16" y="0" width="10" height="2" fill="#ffcc00"/>
  <rect x="16" y="2" width="12" height="2" fill="#ff2e93"/>
  <rect x="16" y="4" width="10" height="2" fill="#00f0ff"/>
  <!-- Ondulação -->
  <rect x="26" y="0" width="2" height="1" fill="#e6a800"/>
  <rect x="28" y="2" width="1" height="1" fill="#cc1a6e"/>
  <rect x="24" y="5" width="2" height="1" fill="#0098b0"/>
  <rect x="26" y="4" width="2" height="1" fill="#0098b0"/>
  <!-- Brilho do mastro -->
  <rect x="14" y="2" width="1" height="1" fill="#fff"/>
  <!-- Cabeça (4 tons de magenta) -->
  <rect x="9" y="11" width="14" height="1" fill="#7a0e3a"/>
  <rect x="7" y="12" width="18" height="1" fill="#cc1a6e"/>
  <rect x="8" y="12" width="3" height="1" fill="#ff2e93"/>
  <rect x="6" y="13" width="20" height="1" fill="#ff2e93"/>
  <rect x="7" y="13" width="4" height="1" fill="#ff5fa8"/>
  <rect x="6" y="14" width="20" height="1" fill="#ff5fa8"/>
  <rect x="6" y="15" width="20" height="1" fill="#ff2e93"/>
  <rect x="6" y="16" width="20" height="1" fill="#cc1a6e"/>
  <!-- Sobrancelhas determinadas (V invertido) -->
  <rect x="9" y="14" width="4" height="1" fill="#4a0822"/>
  <rect x="19" y="14" width="4" height="1" fill="#4a0822"/>
  <rect x="10" y="13" width="1" height="1" fill="#4a0822"/>
  <rect x="22" y="13" width="1" height="1" fill="#4a0822"/>
  <!-- Olhos amarelos (determinados) -->
  <rect x="9" y="15" width="4" height="3" fill="#ffcc00"/>
  <rect x="19" y="15" width="4" height="3" fill="#ffcc00"/>
  <rect x="9" y="15" width="3" height="1" fill="#fff"/>
  <rect x="19" y="15" width="3" height="1" fill="#fff"/>
  <rect x="11" y="17" width="1" height="1" fill="#ff6b35"/>
  <rect x="21" y="17" width="1" height="1" fill="#ff6b35"/>
  <!-- Bochechas amarelas -->
  <rect x="5" y="18" width="3" height="2" fill="#ffcc00"/>
  <rect x="24" y="18" width="3" height="2" fill="#ffcc00"/>
  <rect x="5" y="18" width="2" height="1" fill="#fff95e"/>
  <rect x="24" y="18" width="2" height="1" fill="#fff95e"/>
  <!-- Boca firme/sorriso decidido -->
  <rect x="11" y="18" width="10" height="1" fill="#4a0822"/>
  <rect x="12" y="19" width="8" height="1" fill="#7a0e3a"/>
  <rect x="13" y="20" width="6" height="1" fill="#cc1a6e"/>
  <!-- Pescoço -->
  <rect x="13" y="21" width="6" height="1" fill="#cc1a6e"/>
  <!-- Corpo -->
  <rect x="7" y="20" width="6" height="1" fill="#ff5fa8"/>
  <rect x="19" y="20" width="6" height="1" fill="#ff5fa8"/>
  <rect x="6" y="21" width="20" height="1" fill="#ff2e93"/>
  <rect x="7" y="21" width="3" height="1" fill="#ff5fa8"/>
  <rect x="6" y="22" width="20" height="1" fill="#ff2e93"/>
  <rect x="6" y="23" width="20" height="1" fill="#cc1a6e"/>
  <!-- Faixa tricolor no peito -->
  <rect x="8" y="23" width="16" height="2" fill="#ff6b35"/>
  <rect x="13" y="23" width="6" height="2" fill="#ffcc00"/>
  <rect x="15" y="23" width="2" height="2" fill="#fff95e"/>
  <!-- Símbolo de transformação (raio) -->
  <rect x="15" y="24" width="1" height="1" fill="#ff2e93"/>
  <rect x="16" y="23" width="1" height="1" fill="#ff2e93"/>
  <!-- Mãozinha esquerda erguida (gesto de mudança) -->
  <rect x="4" y="20" width="2" height="2" fill="#ff2e93"/>
  <rect x="2" y="18" width="2" height="3" fill="#ff2e93"/>
  <rect x="0" y="15" width="3" height="3" fill="#ffcc00"/>
  <rect x="0" y="15" width="2" height="1" fill="#fff95e"/>
  <rect x="0" y="17" width="2" height="1" fill="#cc9900"/>
  <!-- Mãozinha direita com punho cerrado -->
  <rect x="26" y="20" width="2" height="2" fill="#ff2e93"/>
  <rect x="28" y="20" width="2" height="2" fill="#ff2e93"/>
  <rect x="28" y="19" width="1" height="1" fill="#cc1a6e"/>
  <!-- Pernas (cyan, contraste) -->
  <rect x="9" y="25" width="4" height="2" fill="#00f0ff"/>
  <rect x="19" y="25" width="4" height="2" fill="#00f0ff"/>
  <rect x="9" y="27" width="4" height="1" fill="#0098b0"/>
  <rect x="19" y="27" width="4" height="1" fill="#0098b0"/>
  <!-- Pés (botas) -->
  <rect x="8" y="28" width="6" height="2" fill="#4a1078"/>
  <rect x="18" y="28" width="6" height="2" fill="#4a1078"/>
  <rect x="8" y="28" width="6" height="1" fill="#1a0633"/>
  <rect x="18" y="28" width="6" height="1" fill="#1a0633"/>
</svg>
