  <rect x="9" y="10" width="14" height="1" fill="#cc4515"/>
  <rect x="7" y="11" width="18" height="1" fill="#ff6b35"/>
  <rect x="8" y="11" width="3" height="1" fill="#ff9966"/>
  <rect x="6" y="12" width="20" height="1" fill="#ff8c5a"/>
  <rect x="7" y="12" width="4" height="1" fill="#ffb38c"/>
  <rect x="6" y="13" width="20" height="1" fill="#ff8c5a"/>
  <rect x="6" y="14" width="20" height="1" fill="#ff6b35"/>
  <rect x="6" y="15" width="20" height="1" fill="#cc4515"/>
