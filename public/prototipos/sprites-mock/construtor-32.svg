  <rect x="9" y="12" width="3" height="1" fill="#7a2810"/>
  <rect x="20" y="12" width="3" height="1" fill="#7a2810"/>
  <!-- Olhos cyan determinados -->
  <rect x="9" y="13" width="4" height="3" fill="#00f0ff"/>
