  <rect x="5" y="16" width="3" height="2" fill="#ffcc00"/>
  <rect x="24" y="16" width="3" height="2" fill="#ffcc00"/>
  <rect x="5" y="16" width="2" height="1" fill="#fff95e"/>
  <rect x="24" y="16" width="2" height="1" fill="#fff95e"/>
