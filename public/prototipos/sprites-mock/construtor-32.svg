  <rect x="14" y="0" width="4" height="1" fill="#ffcc00"/>
  <rect x="10" y="1" width="2" height="1" fill="#ffcc00"/>
  <rect x="13" y="1" width="6" height="1" fill="#ffcc00"/>
  <rect x="20" y="1" width="2" height="1" fill="#ffcc00"/>
  <rect x="10" y="2" width="12" height="2" fill="#ffcc00"/>
  <rect x="11" y="2" width="3" height="1" fill="#fff95e"/>
  <rect x="9" y="4" width="14" height="2" fill="#ffcc00"/>
  <rect x="10" y="6" width="12" height="1" fill="#e6a800"/>
  <rect x="11" y="7" width="10" height="1" fill="#cc8800"/>
  <!-- Furo da engrenagem (mecanismo) -->
  <rect x="14" y="3" width="4" height="3" fill="#ff6b35"/>
  <rect x="15" y="4" width="2" height="1" fill="#cc4515"/>
