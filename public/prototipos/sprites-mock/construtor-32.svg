  <rect x="9" y="24" width="4" height="2" fill="#cc4515"/>
  <rect x="19" y="24" width="4" height="2" fill="#cc4515"/>
  <rect x="9" y="26" width="4" height="2" fill="#7a2810"/>
  <rect x="19" y="26" width="4" height="2" fill="#7a2810"/>
  <!-- Botas pesadas -->
  <rect x="8" y="28" width="6" height="2" fill="#4a1078"/>
  <rect x="18" y="28" width="6" height="2" fill="#4a1078"/>
  <rect x="8" y="28" width="6" height="1" fill="#664400"/>
  <rect x="18" y="28" width="6" height="1" fill="#664400"/>
