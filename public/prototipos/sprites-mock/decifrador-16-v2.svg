<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Decifrador 16x16 v2: ondas wifi + cabeça ciano 3 tons + tela no rosto + mãozinha com chip -->
  <!-- Ondas wifi -->
  <rect x="5" y="0" width="6" height="1" fill="#00f0ff"/>
  <rect x="4" y="1" width="1" height="1" fill="#00f0ff"/>
  <rect x="11" y="1" width="1" height="1" fill="#00f0ff"/>
  <rect x="6" y="1" width="4" height="1" fill="#fff95e"/>
  <rect x="7" y="2" width="2" height="1" fill="#ff2e93"/>
  <rect x="6" y="2" width="1" height="1" fill="#cc1a6e"/>
  <rect x="9" y="2" width="1" height="1" fill="#cc1a6e"/>
  <rect x="7" y="2" width="1" height="1" fill="#fff"/>
  <rect x="7" y="3" width="2" height="1" fill="#00f0ff"/>
  <rect x="7" y="4" width="2" height="1" fill="#0098b0"/>
  <!-- Cabeça (3 tons de ciano) -->
  <rect x="4" y="5" width="8" height="1" fill="#0098b0"/>
  <rect x="3" y="6" width="10" height="1" fill="#00f0ff"/>
  <rect x="4" y="6" width="1" height="1" fill="#7af6ff"/>
  <rect x="3" y="7" width="10" height="1" fill="#7af6ff"/>
  <rect x="3" y="8" width="10" height="1" fill="#00f0ff"/>
  <!-- Tela digital no rosto -->
  <rect x="5" y="7" width="2" height="2" fill="#1a0633"/>
  <rect x="9" y="7" width="2" height="2" fill="#1a0633"/>
  <rect x="5" y="7" width="1" height="1" fill="#fff95e"/>
  <rect x="10" y="7" width="1" height="1" fill="#fff95e"/>
  <rect x="6" y="8" width="1" height="1" fill="#7ee787"/>
  <rect x="9" y="8" width="1" height="1" fill="#7ee787"/>
  <!-- LED bochechas -->
  <rect x="3" y="9" width="1" height="1" fill="#ff2e93"/>
  <rect x="12" y="9" width="1" height="1" fill="#ff2e93"/>
  <!-- Boca tipo loading -->
  <rect x="6" y="9" width="4" height="1" fill="#1a0633"/>
  <rect x="6" y="9" width="2" height="1" fill="#fff95e"/>
  <!-- Corpo (bytes) -->
  <rect x="4" y="9" width="2" height="1" fill="#0098b0"/>
  <rect x="10" y="9" width="2" height="1" fill="#0098b0"/>
  <rect x="4" y="10" width="8" height="1" fill="#00f0ff"/>
  <rect x="5" y="10" width="1" height="1" fill="#fff95e"/>
  <rect x="7" y="10" width="1" height="1" fill="#fff95e"/>
  <rect x="9" y="10" width="1" height="1" fill="#fff95e"/>
  <rect x="5" y="11" width="6" height="1" fill="#0098b0"/>
  <!-- Mãozinha esquerda com chip verde -->
  <rect x="2" y="10" width="1" height="1" fill="#00f0ff"/>
  <rect x="0" y="9" width="2" height="2" fill="#7ee787"/>
  <rect x="0" y="9" width="1" height="1" fill="#a8f0ad"/>
  <!-- Mãozinha direita -->
  <rect x="13" y="10" width="1" height="1" fill="#00f0ff"/>
  <!-- Pernas -->
  <rect x="4" y="12" width="2" height="1" fill="#ff2e93"/>
  <rect x="10" y="12" width="2" height="1" fill="#ff2e93"/>
  <rect x="4" y="13" width="2" height="1" fill="#cc1a6e"/>
  <rect x="10" y="13" width="2" height="1" fill="#cc1a6e"/>
</svg>
