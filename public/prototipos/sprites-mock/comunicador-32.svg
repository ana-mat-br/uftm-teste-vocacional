<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Comunicador 32x32 Stardew-tier -->
  <!-- Balão de fala grande -->
  <rect x="18" y="0" width="12" height="1" fill="#fff8e7"/>
  <rect x="17" y="1" width="14" height="6" fill="#fff8e7"/>
  <rect x="18" y="7" width="12" height="1" fill="#fff8e7"/>
  <rect x="17" y="1" width="3" height="2" fill="#fff"/>
  <!-- Borda do balão -->
  <rect x="17" y="0" width="1" height="1" fill="#d4a8ff"/>
  <rect x="30" y="0" width="1" height="1" fill="#d4a8ff"/>
  <!-- "..." dentro do balão -->
  <rect x="20" y="3" width="2" height="2" fill="#ff2e93"/>
  <rect x="23" y="3" width="2" height="2" fill="#ff2e93"/>
  <rect x="26" y="3" width="2" height="2" fill="#ff2e93"/>
  <!-- Cauda do balão apontando pra boca -->
  <rect x="16" y="6" width="1" height="1" fill="#fff8e7"/>
  <rect x="15" y="7" width="1" height="1" fill="#fff8e7"/>
  <rect x="14" y="8" width="1" height="1" fill="#fff8e7"/>
  <!-- Cabeça (4 tons de amarelo) -->
  <rect x="9" y="9" width="14" height="1" fill="#e6a800"/>
  <rect x="7" y="10" width="18" height="1" fill="#ffcc00"/>
  <rect x="8" y="10" width="3" height="1" fill="#fff95e"/>
  <rect x="6" y="11" width="20" height="1" fill="#fff95e"/>
  <rect x="7" y="11" width="4" height="1" fill="#ffffaa"/>
  <rect x="6" y="12" width="20" height="1" fill="#fff95e"/>
  <rect x="6" y="13" width="20" height="1" fill="#ffcc00"/>
  <rect x="6" y="14" width="20" height="1" fill="#ffcc00"/>
  <!-- Sobrancelhas (sorrindo) -->
  <rect x="9" y="11" width="3" height="1" fill="#cc8800"/>
  <rect x="20" y="11" width="3" height="1" fill="#cc8800"/>
  <!-- Olhos enormes sorrindo -->
  <rect x="9" y="12" width="4" height="3" fill="#4a1078"/>
  <rect x="19" y="12" width="4" height="3" fill="#4a1078"/>
  <rect x="9" y="12" width="3" height="1" fill="#fff"/>
  <rect x="19" y="12" width="3" height="1" fill="#fff"/>
  <rect x="10" y="13" width="2" height="1" fill="#00f0ff"/>
  <rect x="20" y="13" width="2" height="1" fill="#00f0ff"/>
  <!-- Bochechas (sorriso enorme) -->
  <rect x="5" y="15" width="3" height="2" fill="#ff5fa8"/>
  <rect x="24" y="15" width="3" height="2" fill="#ff5fa8"/>
  <rect x="6" y="15" width="2" height="1" fill="#ff8fc8"/>
  <rect x="24" y="15" width="2" height="1" fill="#ff8fc8"/>
  <!-- Boca aberta (falando alto) -->
  <rect x="11" y="15" width="10" height="1" fill="#ff2e93"/>
  <rect x="12" y="16" width="8" height="2" fill="#ff2e93"/>
  <rect x="13" y="16" width="6" height="1" fill="#ff8fc8"/>
  <rect x="14" y="17" width="4" height="1" fill="#ff5fa8"/>
  <rect x="13" y="18" width="6" height="1" fill="#cc1a6e"/>
  <!-- Pescoço -->
  <rect x="13" y="19" width="6" height="1" fill="#ffcc00"/>
  <!-- Corpo -->
  <rect x="7" y="18" width="6" height="1" fill="#fff95e"/>
  <rect x="19" y="18" width="6" height="1" fill="#fff95e"/>
  <rect x="6" y="19" width="20" height="1" fill="#ffcc00"/>
  <rect x="7" y="19" width="6" height="1" fill="#fff95e"/>
  <rect x="19" y="19" width="6" height="1" fill="#fff95e"/>
  <rect x="6" y="20" width="20" height="1" fill="#fff95e"/>
  <rect x="7" y="20" width="3" height="1" fill="#ffffaa"/>
  <rect x="8" y="21" width="16" height="1" fill="#ffcc00"/>
  <rect x="9" y="22" width="14" height="1" fill="#e6a800"/>
  <!-- Faixa magenta no peito -->
  <rect x="10" y="23" width="12" height="1" fill="#ff2e93"/>
  <rect x="15" y="23" width="2" height="1" fill="#fff95e"/>
  <!-- Mãozinha esquerda com MICROFONE -->
  <rect x="4" y="19" width="2" height="2" fill="#fff95e"/>
  <rect x="0" y="16" width="3" height="4" fill="#cc1a6e"/>
  <rect x="0" y="16" width="2" height="1" fill="#ff2e93"/>
  <rect x="0" y="20" width="3" height="2" fill="#7a0e3a"/>
  <rect x="1" y="22" width="1" height="2" fill="#4a1078"/>
  <!-- Mãozinha direita acenando -->
  <rect x="26" y="19" width="2" height="2" fill="#fff95e"/>
  <rect x="28" y="18" width="2" height="2" fill="#fff95e"/>
  <!-- Pernas -->
  <rect x="9" y="24" width="4" height="2" fill="#ff5fa8"/>
  <rect x="19" y="24" width="4" height="2" fill="#ff5fa8"/>
  <rect x="9" y="26" width="4" height="2" fill="#cc1a6e"/>
  <rect x="19" y="26" width="4" height="2" fill="#cc1a6e"/>
  <!-- Pés -->
  <rect x="8" y="28" width="6" height="2" fill="#4a1078"/>
  <rect x="18" y="28" width="6" height="2" fill="#4a1078"/>
</svg>
