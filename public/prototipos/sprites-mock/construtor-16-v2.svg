<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Construtor 16x16 v2: engrenagem + cabeça 3 tons + mãozinha com martelinho -->
  <!-- Engrenagem -->
  <rect x="7" y="0" width="2" height="1" fill="#ffcc00"/>
  <rect x="5" y="1" width="1" height="1" fill="#ffcc00"/>
  <rect x="6" y="1" width="4" height="1" fill="#ffcc00"/>
  <rect x="10" y="1" width="1" height="1" fill="#ffcc00"/>
  <rect x="5" y="2" width="6" height="1" fill="#ffcc00"/>
  <rect x="6" y="3" width="4" height="1" fill="#e6a800"/>
  <rect x="7" y="2" width="2" height="1" fill="#ff6b35"/>
  <rect x="6" y="1" width="1" height="1" fill="#fff95e"/>
  <rect x="7" y="4" width="2" height="1" fill="#e6a800"/>
  <!-- Cabeça (3 tons de laranja) -->
  <rect x="4" y="5" width="8" height="1" fill="#cc4515"/>
  <rect x="3" y="6" width="10" height="1" fill="#ff6b35"/>
  <rect x="4" y="6" width="1" height="1" fill="#ff9966"/>
  <rect x="3" y="7" width="10" height="1" fill="#ff8c5a"/>
  <rect x="3" y="8" width="10" height="1" fill="#ff6b35"/>
  <!-- Olhos cyan -->
  <rect x="5" y="7" width="2" height="2" fill="#00f0ff"/>
  <rect x="9" y="7" width="2" height="2" fill="#00f0ff"/>
  <rect x="5" y="7" width="1" height="1" fill="#fff"/>
  <rect x="9" y="7" width="1" height="1" fill="#fff"/>
  <!-- Bochechas amarelas -->
  <rect x="3" y="9" width="1" height="1" fill="#ffcc00"/>
  <rect x="12" y="9" width="1" height="1" fill="#ffcc00"/>
  <!-- Boca firme -->
  <rect x="7" y="9" width="2" height="1" fill="#cc4515"/>
  <!-- Corpo -->
  <rect x="4" y="9" width="3" height="1" fill="#ff8c5a"/>
  <rect x="9" y="9" width="3" height="1" fill="#ff8c5a"/>
  <rect x="4" y="10" width="8" height="1" fill="#ff6b35"/>
  <rect x="5" y="10" width="6" height="1" fill="#ff8c5a"/>
  <!-- Cinto com fivela -->
  <rect x="5" y="11" width="6" height="1" fill="#ffcc00"/>
  <rect x="7" y="11" width="2" height="1" fill="#cc9900"/>
  <!-- Mãozinha esquerda com martelinho amarelo -->
  <rect x="2" y="10" width="1" height="1" fill="#ff8c5a"/>
  <rect x="0" y="9" width="2" height="1" fill="#cc9900"/>
  <rect x="1" y="10" width="1" height="1" fill="#cc9900"/>
  <!-- Mãozinha direita -->
  <rect x="13" y="10" width="1" height="1" fill="#ff8c5a"/>
  <!-- Pernas -->
  <rect x="4" y="12" width="2" height="1" fill="#cc4515"/>
  <rect x="10" y="12" width="2" height="1" fill="#cc4515"/>
  <rect x="4" y="13" width="2" height="1" fill="#ff2e93"/>
  <rect x="10" y="13" width="2" height="1" fill="#ff2e93"/>
</svg>
