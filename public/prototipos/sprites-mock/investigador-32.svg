  <rect x="9" y="23" width="4" height="2" fill="#ff2e93"/>
  <rect x="19" y="23" width="4" height="2" fill="#ff2e93"/>
  <rect x="9" y="25" width="4" height="2" fill="#cc1a6e"/>
  <rect x="19" y="25" width="4" height="2" fill="#cc1a6e"/>
  <!-- Pés -->
  <rect x="8" y="27" width="6" height="2" fill="#4a1078"/>
  <rect x="18" y="27" width="6" height="2" fill="#4a1078"/>
  <rect x="8" y="29" width="6" height="1" fill="#1a0633"/>
  <rect x="18" y="29" width="6" height="1" fill="#1a0633"/>
