  <rect x="4" y="11" width="16" height="1" fill="#ffb3d9"/>
  <rect x="4" y="12" width="16" height="1" fill="#ff8fc8"/>
  <!-- Olhos grandes (mais detalhados) -->
  <rect x="7" y="10" width="3" height="3" fill="#4a1078"/>
  <rect x="14" y="10" width="3" height="3" fill="#4a1078"/>
  <rect x="7" y="10" width="2" height="1" fill="#fff"/>
  <rect x="14" y="10" width="2" height="1" fill="#fff"/>
  <rect x="8" y="11" width="1" height="1" fill="#00f0ff"/>
  <rect x="15" y="11" width="1" height="1" fill="#00f0ff"/>
  <!-- Bochechas (gradient) -->
  <rect x="4" y="13" width="2" height="1" fill="#ff5fa8"/>
