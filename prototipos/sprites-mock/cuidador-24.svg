  <rect x="15" y="18" width="3" height="1" fill="#ff5fa8"/>
  <rect x="6" y="19" width="3" height="2" fill="#cc1a6e"/>
  <rect x="15" y="19" width="3" height="2" fill="#cc1a6e"/>
