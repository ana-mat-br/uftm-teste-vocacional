  <rect x="6" y="13" width="4" height="1" fill="#ffb3d9"/>
  <rect x="14" y="13" width="4" height="1" fill="#ffb3d9"/>
  <rect x="5" y="14" width="14" height="1" fill="#ff8fc8"/>
  <rect x="6" y="14" width="4" height="1" fill="#ffb3d9"/>
  <rect x="14" y="14" width="4" height="1" fill="#ffb3d9"/>
