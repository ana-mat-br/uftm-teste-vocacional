  <rect x="8" y="2" width="2" height="1" fill="#ffe680"/>
  <rect x="10" y="2" width="3" height="1" fill="#ffcc00"/>
  <rect x="13" y="2" width="3" height="1" fill="#e6a800"/>
  <rect x="8" y="3" width="8" height="1" fill="#ffcc00"/>
  <rect x="9" y="3" width="2" height="1" fill="#ffe680"/>
  <rect x="8" y="4" width="8" height="1" fill="#ffcc00"/>
  <rect x="9" y="5" width="6" height="1" fill="#ffcc00"/>
  <rect x="10" y="6" width="4" height="1" fill="#e6a800"/>
  <rect x="11" y="7" width="2" height="1" fill="#cc8800"/>
  <!-- Cabeça (com sombreamento triplo) -->
  <rect x="6" y="8" width="12" height="1" fill="#ff8fc8"/>
  <rect x="5" y="9" width="14" height="1" fill="#ffb3d9"/>
